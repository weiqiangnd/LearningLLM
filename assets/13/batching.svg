<text x="556" y="452" text-anchor="middle" class="cap">同一个窗口错开一位：位置 t 的输入是 x[t]，它要预测的答案就是 y[t] = x[t+1]</text>
<rect x="90" y="512" width="700" height="250" rx="14" fill="#fbfdff" stroke="#2563eb" stroke-width="1.4"/>
<text x="110" y="544" text-anchor="start" class="h2">一条样本 = 128 条监督（列出前 5 条）</text>
<text x="120" y="578" text-anchor="start" class="mono">看到 'F'</text>
<text x="340" y="578" text-anchor="start" class="mono">→</text>
<text x="380" y="578" text-anchor="start" class="mono">该预测 'i'</text>
<text x="120" y="612" text-anchor="start" class="mono">看到 'Fi'</text>
<text x="340" y="612" text-anchor="start" class="mono">→</text>
<text x="380" y="612" text-anchor="start" class="mono">该预测 'r'</text>
<text x="120" y="646" text-anchor="start" class="mono">看到 'Fir'</text>
<text x="340" y="646" text-anchor="start" class="mono">→</text>
<text x="380" y="646" text-anchor="start" class="mono">该预测 's'</text>
<text x="120" y="680" text-anchor="start" class="mono">看到 'Firs'</text>
<text x="340" y="680" text-anchor="start" class="mono">→</text>
<text x="380" y="680" text-anchor="start" class="mono">该预测 't'</text>
<text x="120" y="714" text-anchor="start" class="mono">看到 'First'</text>
<text x="340" y="714" text-anchor="start" class="mono">→</text>
<text x="380" y="714" text-anchor="start" class="mono">该预测 ' '</text>
<text x="110" y="744" text-anchor="start" class="small">因果掩码保证第 t 个位置只看得到 x[0..t]，所以这 128 条能一次并行算完</text>
<rect x="900" y="512" width="540" height="250" rx="14" fill="#fffdfa" stroke="#ea580c" stroke-width="1.4"/>
<text x="920" y="544" text-anchor="start" class="h2">堆成一批：32 个互不相干的窗口</text>
<rect x="934" y="570" width="300" height="20" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<rect x="941" y="596" width="300" height="20" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<rect x="948" y="622" width="300" height="20" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<rect x="955" y="648" width="300" height="20" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<rect x="962" y="674" width="300" height="20" rx="4" fill="#fef3c7" stroke="#b45309" stroke-width="1.2"/>
<text x="1090" y="689" text-anchor="middle" class="small">…</text>
<text x="1270" y="604" text-anchor="start" class="monob">x: [32, 128]</text>
<text x="1270" y="630" text-anchor="start" class="monob">y: [32, 128]</text>
<text x="920" y="720" text-anchor="start" class="small">一次前向 = 32 × 128 = 4096 条监督；起点随机，</text>
<text x="920" y="742" text-anchor="start" class="small">所以不必把语料整整齐齐切成互不重叠的段落</text>
