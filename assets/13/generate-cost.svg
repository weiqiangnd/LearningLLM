<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 606">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <defs>
    <marker id="aGray" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/></marker>
    <marker id="aSlate" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#334155"/></marker>
    <marker id="aBlue" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#2563eb"/></marker>
    <marker id="aOrange" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#ea580c"/></marker>
    <marker id="aGreen" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#059669"/></marker>
    <marker id="aRed" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#dc2626"/></marker>
    <marker id="aPurple" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0 0, 11 4, 0 8" fill="#7c3aed"/></marker>
  </defs>

  <style>
    text { font-family: 'Noto Sans CJK SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'WenQuanYi Zen Hei', sans-serif; }
    .title  { font-size: 25px; font-weight: 700; fill: #374151; }
    .h2     { font-size: 18px; font-weight: 700; fill: #374151; }
    .lbl    { font-size: 16px; font-weight: 600; fill: #374151; }
    .sub    { font-size: 14px; fill: #334155; }
    .mono   { font-size: 14px; font-family: 'Noto Sans Mono CJK SC', 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace; fill: #374151; }
    .monob  { font-size: 14px; font-weight: 600; font-family: 'Noto Sans Mono CJK SC', 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace; fill: #374151; }
    .monos  { font-size: 13px; font-family: 'Noto Sans Mono CJK SC', 'SFMono-Regular', 'Consolas', 'Liberation Mono', monospace; fill: #334155; }
    .small  { font-size: 13px; fill: #334155; }
    .cap    { font-size: 15px; fill: #334155; }
    .tag    { font-size: 13px; font-weight: 700; }
  </style>
<text x="710.0" y="46" text-anchor="middle" class="title">自回归生成的开销：每写一个字符，都把整个前缀重算一遍</text>
<text x="710.0" y="76" text-anchor="middle" class="cap">第 n 步要对长度 n 的前缀做一次完整前向，但真正新增的只有最后那一格 —— 其余全是上一步算过的</text>
<text x="128" y="158" text-anchor="end" class="lbl">第 1 步</text>
<rect x="150" y="130" width="48" height="42" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
<text x="222" y="158" text-anchor="start" class="small">前向 1 个位置，其中 0 个是重算的</text>
<text x="128" y="220" text-anchor="end" class="lbl">第 2 步</text>
<rect x="150" y="192" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="204" y="192" width="48" height="42" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
<text x="276" y="220" text-anchor="start" class="small">前向 2 个位置，其中 1 个是重算的</text>
<text x="128" y="282" text-anchor="end" class="lbl">第 3 步</text>
<rect x="150" y="254" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="204" y="254" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="258" y="254" width="48" height="42" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
<text x="330" y="282" text-anchor="start" class="small">前向 3 个位置，其中 2 个是重算的</text>
<text x="128" y="344" text-anchor="end" class="lbl">第 4 步</text>
<rect x="150" y="316" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="204" y="316" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="258" y="316" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="312" y="316" width="48" height="42" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
<text x="384" y="344" text-anchor="start" class="small">前向 4 个位置，其中 3 个是重算的</text>
<text x="128" y="406" text-anchor="end" class="lbl">第 5 步</text>
<rect x="150" y="378" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="204" y="378" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="258" y="378" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="312" y="378" width="48" height="42" rx="6" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.6"/>
<rect x="366" y="378" width="48" height="42" rx="6" fill="#dcfce7" stroke="#059669" stroke-width="1.6"/>
<text x="438" y="406" text-anchor="start" class="small">前向 5 个位置，其中 4 个是重算的</text>
<text x="128" y="464" text-anchor="end" class="lbl">…</text>
<rect x="150" y="486" width="22" height="22" rx="5" fill="#dcfce7" stroke="#059669" stroke-width="1.5"/>
<text x="182" y="503" text-anchor="start" class="small">这一步真正新增的位置</text>
<rect x="390" y="486" width="22" height="22" rx="5" fill="#f3f4f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="422" y="503" text-anchor="start" class="small">上一步已经算过、这一步又算一遍的位置</text>
<rect x="830" y="130" width="520" height="250" rx="14" fill="#fbfdff" stroke="#2563eb" stroke-width="1.4"/>
<text x="850" y="164" text-anchor="start" class="h2">生成 128 个 token 的总开销</text>
<text x="860" y="206" text-anchor="start" class="sub">累计前向的位置数</text>
<text x="1320" y="206" text-anchor="end" class="monob">1 + 2 + … + 128 = 8,256</text>
<text x="860" y="246" text-anchor="start" class="sub">其中真正新出现的</text>
<text x="1320" y="246" text-anchor="end" class="monob">128</text>
<text x="860" y="286" text-anchor="start" class="sub">重复计算占比</text>
<text x="1320" y="286" text-anchor="end" class="monob">≈ 98.4%</text>
<text x="850" y="340" text-anchor="start" class="small">序列越长，浪费的比例越高 —— 这是推理慢的主因之一</text>
<rect x="830" y="410" width="520" height="128" rx="14" fill="#f0fdf4" stroke="#059669" stroke-width="1.6"/>
<text x="850" y="444" text-anchor="start" class="h2">为什么可以省掉这些重复</text>
<text x="850" y="474" text-anchor="start" class="small">因果掩码下，前面 token 的 K / V 不受后面影响，</text>
<text x="850" y="498" text-anchor="start" class="small">算过一次就永远有效 —— 缓存起来即可，这就是 KV cache</text>
<text x="850" y="522" text-anchor="start" class="small">（第 14 章的主题）</text>
<text x="710.0" y="580" text-anchor="middle" class="cap">本章这个 generate 循环是最朴素的写法：正确、好懂，但每一步都在做重复功</text>
</svg>
